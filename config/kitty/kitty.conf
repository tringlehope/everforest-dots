# Шрифт, отступы и оболочка
font_family             JetBrainsMono Nerd Font
font_size               14.0
window_padding_width    14 18
confirm_os_window_close 0
shell                   /usr/bin/fish
remember_window_size    no

# Копирование и вставка мышкой без Ctrl+Shift+C
mouse_map right press ungrabbed paste_from_clipboard

# Прокрутка
pixel_scroll            yes
momentum_scroll         0.9
wheel_scroll_multiplier 3.0

# Анимация курсора
cursor_shape                 block
cursor_blink_interval        0.5 ease-in-out
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# Тема Everforest Dark Soft (100% непрозрачная)
background_opacity    1.0
foreground            #d3c6aa
background            #2d353b
selection_foreground  #2d353b
selection_background  #a7c080
cursor                #a7c080
cursor_text_color     #2d353b
url_color             #7fbbb3

color0  #343f44
color8  #859289
color1  #e67e80
color9  #e67e80
color2  #a7c080
color10 #a7c080
color3  #dbbc7f
color11 #dbbc7f
color4  #7fbbb3
color12 #7fbbb3
color5  #d699b6
color13 #d699b6
color6  #83c092
color14 #83c092
color7  #d3c6aa
color15 #d3c6aa

map ctrl+equal change_font_size all +2.0
map ctrl+plus change_font_size all +2.0
map ctrl+kp_add change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+kp_subtract change_font_size all -2.0
